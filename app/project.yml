name: Proot
options:
  bundleIdPrefix: dev.proot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Proot:
    type: application
    platform: iOS
    sources:
      - path: Proot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.proot.app
        INFOPLIST_FILE: Proot/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
