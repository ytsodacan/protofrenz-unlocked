; Proot firmware — ProtoFrenz V4 controller (ESP32, 8MB flash, 2x 64x32 HUB75)
[env:protofrenz]
platform = espressif32@7.0.1  ; Arduino core 2.0.17
board = esp32dev
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -O2
  -DCORE_DEBUG_LEVEL=0
  -DPIXEL_COLOR_DEPTH_BITS=7
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
  -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
  -DWS_MAX_QUEUED_MESSAGES=16
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
lib_deps =
  mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@^3.0.12
  adafruit/Adafruit GFX Library@^1.11.11
  adafruit/Adafruit NeoPixel@^1.12.3
  h2zero/NimBLE-Arduino@^1.4.3
  esp32async/ESPAsyncWebServer@^3.7.0
  esp32async/AsyncTCP@^3.3.8
  bblanchon/ArduinoJson@^7.2.1
